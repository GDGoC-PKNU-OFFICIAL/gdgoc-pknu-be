spring:
  application:
    name: gdgoc-pknu-be
  profiles:
    default: local
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  # Render는 PORT 환경변수로 포트를 넘긴다. 로컬은 8080
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # 운영은 반드시 실제 값을 채운다. 값이 없으면 기동 자체가 실패한다(의도한 동작 — 서명 키 없이는 뜨면 안 된다).
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS:8}
  admin-seed:
    # 회원가입 API가 없다(PRD 4-3). 비어 있으면 AdminAccountSeeder가 계정을 만들지 않고 경고만 남긴다.
    login-id: ${ADMIN_LOGIN_ID:}
    password: ${ADMIN_PASSWORD:}
  r2:
    # JWT_SECRET과 같은 규칙이다. 운영에서 값이 없으면 기동이 실패한다 — 재검증 없이 저장되는 일을 막는다.
    account-id: ${R2_ACCOUNT_ID}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket: ${R2_BUCKET}
    public-base-url: ${R2_PUBLIC_BASE_URL}
