spring:
  application:
    name: gdgoc-pknu-be
  profiles:
    default: local
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # 운영은 반드시 실제 값을 채운다. 값이 없으면 기동 자체가 실패한다(의도한 동작 — 서명 키 없이는 뜨면 안 된다).
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS:8}
  admin-seed:
    # 회원가입 API가 없다(PRD 4-3). 비어 있으면 AdminAccountSeeder가 계정을 만들지 않고 경고만 남긴다.
    login-id: ${ADMIN_LOGIN_ID:}
    password: ${ADMIN_PASSWORD:}
