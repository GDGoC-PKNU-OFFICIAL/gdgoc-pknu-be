# Bean Validation 기본 메시지 (한국어). fieldErrors.message가 그대로 화면에 표시된다.
# 필드별 문구가 필요하면 애너테이션에 message를 직접 지정해 덮어쓴다.
jakarta.validation.constraints.NotNull.message=필수 입력 항목입니다.
jakarta.validation.constraints.NotBlank.message=필수 입력 항목입니다.
jakarta.validation.constraints.NotEmpty.message=필수 입력 항목입니다.
jakarta.validation.constraints.Size.message={min}자(개) 이상 {max}자(개) 이하로 입력해 주세요.
jakarta.validation.constraints.Pattern.message=형식이 올바르지 않습니다.
jakarta.validation.constraints.Min.message={value} 이상이어야 합니다.
jakarta.validation.constraints.Max.message={value} 이하여야 합니다.
jakarta.validation.constraints.PositiveOrZero.message=0 이상이어야 합니다.
jakarta.validation.constraints.AssertTrue.message=올바른 값이 아닙니다.
