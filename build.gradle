plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.gdgocpknu'
version = '0.0.1-SNAPSHOT'
description = 'gdgoc-pknu-be'

// Spring Boot 3.5.16이 관리하는 버전보다 먼저 보안 수정이 나온 라이브러리만 올린다. Boot를 올려 같은 버전 이상이
// 관리되면 이 줄은 지운다. 근거(GitHub 보안 권고)는 PR #22 본문에 있다.
ext['tomcat.version'] = '10.1.59'            // 10.1.55 → 보안 권고 7건(Tomcat 자체 인증 · HTTP/2 · web.xml 보안 제약)
ext['jackson-bom.version'] = '2.21.7'        // 2.21.4 → 보안 권고 9건(객체 ID 참조 · 다형성 타입 · XML 시간 타입 등)
ext['postgresql.version'] = '42.7.12'        // 42.7.11 → channelBinding=require 다운그레이드 권고

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation platform('software.amazon.awssdk:bom:2.57.8')
    // 무료 티어 메모리를 아끼려고 기본 HTTP 클라이언트(Apache · Netty) 대신 JDK 기반 클라이언트만 쓴다.
    implementation('software.amazon.awssdk:s3') {
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
        exclude group: 'software.amazon.awssdk', module: 'apache5-client'
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
